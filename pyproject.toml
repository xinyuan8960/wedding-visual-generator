[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wedding-visual"
version = "0.1.0"
description = "Deterministic wedding logo generator: questionnaire -> spec.json -> rendered SVG/PNG, no visual review loop."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20",
    "fonttools>=4.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wedding-visual = "wedding_visual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
